name: Idea
description: Suggest a feature or a change
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe it the way you'd use it, e.g. "when I tap a dot, it should…"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What's annoying or missing today?
  - type: dropdown
    id: device
    attributes:
      label: Where do you play?
      multiple: true
      options:
        - Phone
        - Tablet
        - Computer (mouse)
        - Computer (touchscreen)
